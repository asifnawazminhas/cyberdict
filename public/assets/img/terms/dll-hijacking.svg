<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03090d"/><stop offset=".55" stop-color="#071218"/><stop offset="1" stop-color="#020609"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#a855f7" stop-opacity=".18"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#17303a" stroke-width="1" opacity=".35"/></pattern></defs>
<style>.title{font:900 82px Arial,sans-serif;fill:#f7fbff;letter-spacing:1px} .subtitle{font:700 32px Arial,sans-serif;fill:#a855f7} .eyebrow{font:700 18px monospace;fill:#a855f7;letter-spacing:5px} .definition{font:400 29px Arial,sans-serif;fill:#d7e4eb} .flowNum{font:700 15px monospace;fill:#a855f7}.flowText{font:700 17px Arial,sans-serif;fill:#ecf7fb} .num{font:700 23px monospace} .cardTitle{font:800 27px Arial,sans-serif;fill:#f3f8fb} .takeLabel{font:700 20px monospace;fill:#a855f7;letter-spacing:4px} .take{font:800 29px Arial,sans-serif;fill:#f7fbff}</style>
<rect width="1122" height="1402" fill="url(#bg)"/><rect width="1122" height="1402" fill="url(#grid)"/><circle cx="890" cy="170" r="310" fill="url(#glow)"/><rect x="18" y="18" width="1086" height="1366" rx="34" fill="none" stroke="#a855f7" stroke-width="2" opacity=".75"/>
<text x="58" y="78" class="eyebrow">SECURITY CONCEPT</text><text x="58" y="178" class="title">DLL Hijacking</text><text x="58" y="226" class="subtitle">Unsafe Windows Library Loading</text>
<rect x="55" y="270" width="1012" height="62" rx="18" fill="#09151c" stroke="#a855f7" stroke-width="2"/><foreignObject x="78" y="282" width="966" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:25px;line-height:1.3;color:#e2edf2;">A technique that abuses Windows DLL search behaviour so an unintended library is loaded.</div></foreignObject>
<g><rect x="70" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#a855f7" stroke-width="2"/><text x="152.5" y="387" text-anchor="middle" class="flowNum">01</text><text x="152.5" y="417" text-anchor="middle" class="flowText">Application starts</text></g><g><rect x="270" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#a855f7" stroke-width="2"/><text x="352.5" y="387" text-anchor="middle" class="flowNum">02</text><text x="352.5" y="417" text-anchor="middle" class="flowText">Requests DLL</text></g><g><rect x="470" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#a855f7" stroke-width="2"/><text x="552.5" y="387" text-anchor="middle" class="flowNum">03</text><text x="552.5" y="417" text-anchor="middle" class="flowText">Search order checked</text></g><g><rect x="670" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#a855f7" stroke-width="2"/><text x="752.5" y="387" text-anchor="middle" class="flowNum">04</text><text x="752.5" y="417" text-anchor="middle" class="flowText">Writable path wins</text></g><g><rect x="870" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#a855f7" stroke-width="2"/><text x="952.5" y="387" text-anchor="middle" class="flowNum">05</text><text x="952.5" y="417" text-anchor="middle" class="flowText">Unintended DLL loads</text></g><path d="M235 401 H265" stroke="#ec4899" stroke-width="4"/><path d="M260 394 L271 401 L260 408" fill="none" stroke="#ec4899" stroke-width="4"/><path d="M435 401 H465" stroke="#ec4899" stroke-width="4"/><path d="M460 394 L471 401 L460 408" fill="none" stroke="#ec4899" stroke-width="4"/><path d="M635 401 H665" stroke="#ec4899" stroke-width="4"/><path d="M660 394 L671 401 L660 408" fill="none" stroke="#ec4899" stroke-width="4"/><path d="M835 401 H865" stroke="#ec4899" stroke-width="4"/><path d="M860 394 L871 401 L860 408" fill="none" stroke="#ec4899" stroke-width="4"/><g><rect x="55" y="505" width="492" height="190" rx="22" fill="#09151c" stroke="#a855f7" stroke-width="2"/><rect x="77" y="527" width="76" height="50" rx="12" fill="#a855f7" fill-opacity=".14" stroke="#a855f7"/><text x="115" y="561" text-anchor="middle" class="num" fill="#a855f7">01</text><text x="175" y="563" class="cardTitle">LOAD REQUEST</text><foreignObject x="79" y="593" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">A Windows application attempts to load a DLL by name or relative path.</div></foreignObject></g><g><rect x="575" y="505" width="492" height="190" rx="22" fill="#09151c" stroke="#a855f7" stroke-width="2"/><rect x="597" y="527" width="76" height="50" rx="12" fill="#a855f7" fill-opacity=".14" stroke="#a855f7"/><text x="635" y="561" text-anchor="middle" class="num" fill="#a855f7">02</text><text x="695" y="563" class="cardTitle">SEARCH ORDER</text><foreignObject x="599" y="593" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">Windows checks configured locations according to DLL search rules.</div></foreignObject></g><g><rect x="55" y="735" width="492" height="190" rx="22" fill="#09151c" stroke="#a855f7" stroke-width="2"/><rect x="77" y="757" width="76" height="50" rx="12" fill="#a855f7" fill-opacity=".14" stroke="#a855f7"/><text x="115" y="791" text-anchor="middle" class="num" fill="#a855f7">03</text><text x="175" y="793" class="cardTitle">WRITABLE LOCATION</text><foreignObject x="79" y="823" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">A weakly protected directory appears before the intended library location.</div></foreignObject></g><g><rect x="575" y="735" width="492" height="190" rx="22" fill="#09151c" stroke="#a855f7" stroke-width="2"/><rect x="597" y="757" width="76" height="50" rx="12" fill="#a855f7" fill-opacity=".14" stroke="#a855f7"/><text x="635" y="791" text-anchor="middle" class="num" fill="#a855f7">04</text><text x="695" y="793" class="cardTitle">EXECUTION</text><foreignObject x="599" y="823" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">The application loads the unexpected DLL in its own security context.</div></foreignObject></g><g><rect x="315" y="965" width="492" height="190" rx="22" fill="#09151c" stroke="#a855f7" stroke-width="2"/><rect x="337" y="987" width="76" height="50" rx="12" fill="#a855f7" fill-opacity=".14" stroke="#a855f7"/><text x="375" y="1021" text-anchor="middle" class="num" fill="#a855f7">05</text><text x="435" y="1023" class="cardTitle">DEFENCE</text><foreignObject x="339" y="1053" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">Use safe search paths, remove writable trusted paths and enforce application control.</div></foreignObject></g>
<g><rect x="55" y="1200" width="1012" height="132" rx="24" fill="#081219" stroke="#ec4899" stroke-width="2"/><circle cx="110" cy="1266" r="28" fill="#a855f7" fill-opacity=".15" stroke="#a855f7" stroke-width="2"/><path d="M100 1266 l9 9 18 -22" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/><text x="165" y="1248" class="takeLabel">KEY TAKEAWAY</text><foreignObject x="165" y="1260" width="850" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:27px;font-weight:700;line-height:1.25;color:#f7fbff;">Secure DLL search paths and writable locations to prevent unintended library loading.</div></foreignObject></g>
</svg>