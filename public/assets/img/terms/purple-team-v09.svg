<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030706"/><stop offset="1" stop-color="#08110d"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bb70ff" stroke-opacity=".055"/></pattern>
<radialGradient id="glow"><stop stop-color="#bb70ff" stop-opacity=".17"/><stop offset="1" stop-color="#bb70ff" stop-opacity="0"/></radialGradient>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#bb70ff"/></marker>
</defs>
<rect width="1200" height="1600" fill="url(#bg)"/><rect width="1200" height="1600" fill="url(#grid)"/><circle cx="600" cy="620" r="500" fill="url(#glow)"/>
<rect x="28" y="28" width="1144" height="1544" rx="28" fill="none" stroke="#bb70ff" stroke-opacity=".55" stroke-width="2"/>
<text x="60" y="78" fill="#bb70ff" font-family="monospace" font-size="18" font-weight="700">PURPLE TEAMING</text>
<text x="60" y="178" fill="#f4f7f5" font-family="Arial" font-size="82" font-weight="900">Purple Team</text>
<text x="60" y="226" fill="#bb70ff" font-family="Arial" font-size="30" font-weight="800">Collaborative Security</text>
<rect x="60" y="270" width="1080" height="150" rx="20" fill="#09120d" stroke="#bb70ff" stroke-opacity=".45"/><text x="90" y="315" fill="#bb70ff" font-family="monospace" font-size="16" font-weight="800" text-anchor="start">DEFINITION</text><text x="90" y="355" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">A collaborative approach where offensive and defensive security teams</text><text x="90" y="389" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">work together to improve security outcomes.</text><g>
<circle cx="435" cy="650" r="170" fill="#16080d" stroke="#ff4769" stroke-width="4"/><circle cx="765" cy="650" r="170" fill="#07131b" stroke="#49bfff" stroke-width="4"/><circle cx="600" cy="650" r="120" fill="#130b1b" stroke="#bb70ff" stroke-width="5"/>
<text x="435" y="645" text-anchor="middle" fill="#ff6f89" font-family="Arial" font-size="30" font-weight="900">RED</text><text x="435" y="680" text-anchor="middle" fill="#ff9caf" font-family="Arial" font-size="18" font-weight="700">SIMULATE</text>
<text x="765" y="645" text-anchor="middle" fill="#63c9ff" font-family="Arial" font-size="30" font-weight="900">BLUE</text><text x="765" y="680" text-anchor="middle" fill="#9eddff" font-family="Arial" font-size="18" font-weight="700">DETECT</text>
<text x="600" y="635" text-anchor="middle" fill="#d8b4ff" font-family="Arial" font-size="22" font-weight="900">SHARED</text><text x="600" y="667" text-anchor="middle" fill="#d8b4ff" font-family="Arial" font-size="22" font-weight="900">FEEDBACK</text>
<path d="M395 505 C500 420 700 420 805 505" fill="none" stroke="#bb70ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M805 795 C700 880 500 880 395 795" fill="none" stroke="#bb70ff" stroke-width="5" marker-end="url(#arrow)"/>
</g><rect x="65" y="850" width="495" height="165" rx="24" fill="#08100d" stroke="#bb70ff" stroke-width="2"/><circle cx="107" cy="892" r="24" fill="#bb70ff" fill-opacity=".14" stroke="#bb70ff"/><text x="107" y="900" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="22" font-weight="800">01</text><text x="145" y="898" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">SIMULATE</text><text x="93" y="938" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Red Team executes a controlled</text><text x="93" y="965" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">technique or scenario with a clear</text><text x="93" y="992" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">learning objective.</text><rect x="640" y="850" width="495" height="165" rx="24" fill="#08100d" stroke="#bb70ff" stroke-width="2"/><circle cx="682" cy="892" r="24" fill="#bb70ff" fill-opacity=".14" stroke="#bb70ff"/><text x="682" y="900" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="22" font-weight="800">02</text><text x="720" y="898" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">OBSERVE</text><text x="668" y="938" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Blue Team and analysts review</text><text x="668" y="965" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">telemetry, detections, alerts and</text><text x="668" y="992" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">response behaviour.</text><rect x="65" y="1050" width="495" height="165" rx="24" fill="#08100d" stroke="#bb70ff" stroke-width="2"/><circle cx="107" cy="1092" r="24" fill="#bb70ff" fill-opacity=".14" stroke="#bb70ff"/><text x="107" y="1100" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="22" font-weight="800">03</text><text x="145" y="1098" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">SHARE FINDINGS</text><text x="93" y="1138" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Both sides explain what worked,</text><text x="93" y="1165" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">what failed and what was visible.</text><rect x="640" y="1050" width="495" height="165" rx="24" fill="#08100d" stroke="#bb70ff" stroke-width="2"/><circle cx="682" cy="1092" r="24" fill="#bb70ff" fill-opacity=".14" stroke="#bb70ff"/><text x="682" y="1100" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="22" font-weight="800">04</text><text x="720" y="1098" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">TUNE CONTROLS</text><text x="668" y="1138" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Improve detections, logging,</text><text x="668" y="1165" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">playbooks and preventive controls</text><text x="668" y="1192" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">based on evidence.</text><rect x="350" y="1250" width="495" height="165" rx="24" fill="#08100d" stroke="#bb70ff" stroke-width="2"/><circle cx="392" cy="1292" r="24" fill="#bb70ff" fill-opacity=".14" stroke="#bb70ff"/><text x="392" y="1300" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="22" font-weight="800">05</text><text x="430" y="1298" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">RE-TEST</text><text x="378" y="1338" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Run the scenario again to validate</text><text x="378" y="1365" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">improvements and measure progress.</text><rect x="60" y="1370" width="1080" height="150" rx="20" fill="#07100a" stroke="#bb70ff" stroke-opacity=".4"/><text x="90" y="1410" fill="#bb70ff" font-family="monospace" font-size="18" font-weight="800" text-anchor="start">KEY TAKEAWAYS</text><circle cx="108" cy="1456" r="18" fill="#bb70ff" fill-opacity=".15" stroke="#bb70ff"/><text x="108" y="1463" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="17" font-weight="800">1</text><text x="138" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Faster learning</text><circle cx="448" cy="1456" r="18" fill="#bb70ff" fill-opacity=".15" stroke="#bb70ff"/><text x="448" y="1463" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="17" font-weight="800">2</text><text x="478" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Validated detections</text><circle cx="788" cy="1456" r="18" fill="#bb70ff" fill-opacity=".15" stroke="#bb70ff"/><text x="788" y="1463" text-anchor="middle" fill="#bb70ff" font-family="Arial" font-size="17" font-weight="800">3</text><text x="818" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Shared improvement</text></svg>