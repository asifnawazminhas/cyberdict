    <rect x="24" y="24" width="1074" height="1354" rx="28" fill="none" stroke="#22c55e" stroke-opacity=".75" stroke-width="2"/>
    <text x="70" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="6" font-weight="700" fill="#22c55e">SECURITY CONCEPT</text>
    <text x="70" y="190" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" fill="#f7fbf9">API Security</text>
    <text x="70" y="245" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#22c55e">Protecting Application Interfaces</text>
    <rect x="70" y="295" width="982" height="135" rx="22" fill="#091317" stroke="#22c55e" stroke-opacity=".7" stroke-width="2"/>
    <text x="105" y="343" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="3" font-weight="700" fill="#22c55e">DEFINITION</text>
    <text x="105" y="382" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#f4f8f6">
      <tspan x="105" dy="0">APIs require strong identity, authorization, validation and abuse</tspan><tspan x="105" dy="34">controls.</tspan>
    </text>
    
        <rect x="70" y="485" width="982" height="125" rx="20" fill="#0b1518" stroke="#22c55e" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="547" r="31" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-width="2"/>
        <text x="120" y="557" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#22c55e">01</text>
        <text x="185" y="528" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">DISCOVER</text>
        <text x="185" y="563" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Inventory endpoints and exposed functionality.</tspan></text>
        
        <rect x="70" y="635" width="982" height="125" rx="20" fill="#0b1518" stroke="#22c55e" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="697" r="31" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-width="2"/>
        <text x="120" y="707" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#22c55e">02</text>
        <text x="185" y="678" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">AUTHENTICATE</text>
        <text x="185" y="713" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Verify the calling identity.</tspan></text>
        
        <rect x="70" y="785" width="982" height="125" rx="20" fill="#0b1518" stroke="#22c55e" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="847" r="31" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-width="2"/>
        <text x="120" y="857" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#22c55e">03</text>
        <text x="185" y="828" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">AUTHORIZE</text>
        <text x="185" y="863" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Check object and function permissions server</tspan><tspan x="185" dy="28">side.</tspan></text>
        
        <rect x="70" y="935" width="982" height="125" rx="20" fill="#0b1518" stroke="#22c55e" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="997" r="31" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-width="2"/>
        <text x="120" y="1007" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#22c55e">04</text>
        <text x="185" y="978" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">VALIDATE</text>
        <text x="185" y="1013" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Validate request structure and business rules.</tspan></text>
        
        <rect x="70" y="1085" width="982" height="125" rx="20" fill="#0b1518" stroke="#22c55e" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="1147" r="31" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-width="2"/>
        <text x="120" y="1157" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#22c55e">05</text>
        <text x="185" y="1128" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">MONITOR</text>
        <text x="185" y="1163" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Rate limit, log and detect suspicious use.</tspan></text>
        
    <rect x="70" y="1240" width="982" height="100" rx="20" fill="#0b1518" stroke="#22c55e" stroke-width="2"/>
    <text x="105" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="3" fill="#22c55e">KEY TAKEAWAY</text>
    <text x="105" y="1318" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#f4f8f6">Every API request needs identity, permission and input checks.</text>
