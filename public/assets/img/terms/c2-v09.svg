<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030706"/><stop offset="1" stop-color="#08110d"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#35d7ff" stroke-opacity=".055"/></pattern>
<radialGradient id="glow"><stop stop-color="#35d7ff" stop-opacity=".17"/><stop offset="1" stop-color="#35d7ff" stop-opacity="0"/></radialGradient>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#35d7ff"/></marker>
</defs>
<rect width="1200" height="1600" fill="url(#bg)"/><rect width="1200" height="1600" fill="url(#grid)"/><circle cx="600" cy="620" r="500" fill="url(#glow)"/>
<rect x="28" y="28" width="1144" height="1544" rx="28" fill="none" stroke="#35d7ff" stroke-opacity=".55" stroke-width="2"/>
<text x="60" y="78" fill="#35d7ff" font-family="monospace" font-size="18" font-weight="700">ADVERSARY OPERATIONS</text>
<text x="60" y="178" fill="#f4f7f5" font-family="Arial" font-size="82" font-weight="900">C2</text>
<text x="60" y="226" fill="#35d7ff" font-family="Arial" font-size="30" font-weight="800">Command and Control</text>
<rect x="60" y="270" width="1080" height="150" rx="20" fill="#09120d" stroke="#35d7ff" stroke-opacity=".45"/><text x="90" y="315" fill="#35d7ff" font-family="monospace" font-size="16" font-weight="800" text-anchor="start">DEFINITION</text><text x="90" y="355" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">Command and Control infrastructure is used to communicate with and</text><text x="90" y="389" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">manage systems under an operator&#x27;s control during adversary</text><text x="90" y="423" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">simulations.</text><g>
<rect x="455" y="545" width="290" height="210" rx="26" fill="#08131a" stroke="#35d7ff" stroke-width="3"/>
<rect x="520" y="585" width="160" height="105" rx="12" fill="#0b1d25" stroke="#35d7ff"/><line x1="545" y1="615" x2="655" y2="615" stroke="#35d7ff" stroke-width="8"/><line x1="545" y1="645" x2="625" y2="645" stroke="#35d7ff" stroke-width="8"/>
<text x="600" y="730" text-anchor="middle" fill="#eafaff" font-family="Arial" font-size="25" font-weight="800">C2 SERVER</text>
<circle cx="185" cy="650" r="80" fill="#0b1117" stroke="#35d7ff"/><text x="185" y="660" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="28" font-weight="900">OP</text>
<circle cx="1015" cy="590" r="65" fill="#0b1117" stroke="#35d7ff"/><circle cx="1015" cy="755" r="65" fill="#0b1117" stroke="#35d7ff"/><text x="1015" y="600" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="20" font-weight="800">A1</text><text x="1015" y="765" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="20" font-weight="800">A2</text>
<line x1="265" y1="650" x2="450" y2="650" stroke="#35d7ff" stroke-width="4" marker-end="url(#arrow)"/><line x1="745" y1="620" x2="945" y2="590" stroke="#35d7ff" stroke-width="4" marker-end="url(#arrow)"/><line x1="745" y1="680" x2="945" y2="755" stroke="#35d7ff" stroke-width="4" marker-end="url(#arrow)"/>
</g><rect x="70" y="845" width="490" height="165" rx="24" fill="#08100d" stroke="#35d7ff" stroke-width="2"/><circle cx="112" cy="887" r="24" fill="#35d7ff" fill-opacity=".14" stroke="#35d7ff"/><text x="112" y="895" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="22" font-weight="800">01</text><text x="150" y="893" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">ESTABLISH CONTACT</text><text x="98" y="933" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">A controlled agent reaches the C2</text><text x="98" y="960" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">server and creates an initial</text><text x="98" y="987" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">session.</text><rect x="640" y="845" width="490" height="165" rx="24" fill="#08100d" stroke="#35d7ff" stroke-width="2"/><circle cx="682" cy="887" r="24" fill="#35d7ff" fill-opacity=".14" stroke="#35d7ff"/><text x="682" y="895" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="22" font-weight="800">02</text><text x="720" y="893" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">MAINTAIN SESSION</text><text x="668" y="933" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">The communication channel stays</text><text x="668" y="960" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">available through periodic or</text><text x="668" y="987" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">persistent check-ins.</text><rect x="70" y="1045" width="490" height="165" rx="24" fill="#08100d" stroke="#35d7ff" stroke-width="2"/><circle cx="112" cy="1087" r="24" fill="#35d7ff" fill-opacity=".14" stroke="#35d7ff"/><text x="112" y="1095" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="22" font-weight="800">03</text><text x="150" y="1093" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">SEND TASK</text><text x="98" y="1133" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">The operator sends a command or</text><text x="98" y="1160" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">task through the C2</text><text x="98" y="1187" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">infrastructure.</text><rect x="640" y="1045" width="490" height="165" rx="24" fill="#08100d" stroke="#35d7ff" stroke-width="2"/><circle cx="682" cy="1087" r="24" fill="#35d7ff" fill-opacity=".14" stroke="#35d7ff"/><text x="682" y="1095" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="22" font-weight="800">04</text><text x="720" y="1093" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">EXECUTE ACTION</text><text x="668" y="1133" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">The controlled system performs the</text><text x="668" y="1160" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">requested action during the</text><text x="668" y="1187" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">simulation.</text><rect x="355" y="1240" width="490" height="165" rx="24" fill="#08100d" stroke="#35d7ff" stroke-width="2"/><circle cx="397" cy="1282" r="24" fill="#35d7ff" fill-opacity=".14" stroke="#35d7ff"/><text x="397" y="1290" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="22" font-weight="800">05</text><text x="435" y="1288" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">RETURN OUTPUT</text><text x="383" y="1328" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Results are sent back to the</text><text x="383" y="1355" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">server and displayed to the</text><text x="383" y="1382" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">operator.</text><rect x="60" y="1370" width="1080" height="150" rx="20" fill="#07100a" stroke="#35d7ff" stroke-opacity=".4"/><text x="90" y="1410" fill="#35d7ff" font-family="monospace" font-size="18" font-weight="800" text-anchor="start">KEY TAKEAWAYS</text><circle cx="108" cy="1456" r="18" fill="#35d7ff" fill-opacity=".15" stroke="#35d7ff"/><text x="108" y="1463" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="17" font-weight="800">1</text><text x="138" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Remote tasking</text><circle cx="448" cy="1456" r="18" fill="#35d7ff" fill-opacity=".15" stroke="#35d7ff"/><text x="448" y="1463" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="17" font-weight="800">2</text><text x="478" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Two-way control</text><circle cx="788" cy="1456" r="18" fill="#35d7ff" fill-opacity=".15" stroke="#35d7ff"/><text x="788" y="1463" text-anchor="middle" fill="#35d7ff" font-family="Arial" font-size="17" font-weight="800">3</text><text x="818" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Detection context</text></svg>