<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030706"/><stop offset="1" stop-color="#08110d"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ff4769" stroke-opacity=".055"/></pattern>
<radialGradient id="glow"><stop stop-color="#ff4769" stop-opacity=".17"/><stop offset="1" stop-color="#ff4769" stop-opacity="0"/></radialGradient>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ff4769"/></marker>
</defs>
<rect width="1200" height="1600" fill="url(#bg)"/><rect width="1200" height="1600" fill="url(#grid)"/><circle cx="600" cy="620" r="500" fill="url(#glow)"/>
<rect x="28" y="28" width="1144" height="1544" rx="28" fill="none" stroke="#ff4769" stroke-opacity=".55" stroke-width="2"/>
<text x="60" y="78" fill="#ff4769" font-family="monospace" font-size="18" font-weight="700">OFFENSIVE SECURITY</text>
<text x="60" y="178" fill="#f4f7f5" font-family="Arial" font-size="82" font-weight="900">Red Team</text>
<text x="60" y="226" fill="#ff4769" font-family="Arial" font-size="30" font-weight="800">Adversary Simulation</text>
<rect x="60" y="270" width="1080" height="150" rx="20" fill="#09120d" stroke="#ff4769" stroke-opacity=".45"/><text x="90" y="315" fill="#ff4769" font-family="monospace" font-size="16" font-weight="800" text-anchor="start">DEFINITION</text><text x="90" y="355" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">An offensive security team that simulates realistic adversary</text><text x="90" y="389" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">behaviour to test people, processes and technology.</text><g><path d="M125 705 C300 520 450 555 600 690 C750 825 900 770 1070 560" fill="none" stroke="#ff4769" stroke-width="6" stroke-dasharray="18 12" opacity=".8"/>
<circle cx="600" cy="650" r="100" fill="#16080d" stroke="#ff4769" stroke-width="3"/><path d="M560 685l40-95 40 95-40-30z" fill="none" stroke="#ff4769" stroke-width="7"/><text x="600" y="790" text-anchor="middle" fill="#ff8aa0" font-family="Arial" font-size="22" font-weight="800">SIMULATE REAL ADVERSARY BEHAVIOUR</text></g><rect x="65" y="835" width="495" height="165" rx="24" fill="#08100d" stroke="#ff4769" stroke-width="2"/><circle cx="107" cy="877" r="24" fill="#ff4769" fill-opacity=".14" stroke="#ff4769"/><text x="107" y="885" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="22" font-weight="800">01</text><text x="145" y="883" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">RECONNAISSANCE</text><text x="93" y="923" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Understand the environment and</text><text x="93" y="950" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">identify realistic attack paths</text><text x="93" y="977" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">and objectives.</text><rect x="640" y="835" width="495" height="165" rx="24" fill="#08100d" stroke="#ff4769" stroke-width="2"/><circle cx="682" cy="877" r="24" fill="#ff4769" fill-opacity=".14" stroke="#ff4769"/><text x="682" y="885" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="22" font-weight="800">02</text><text x="720" y="883" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">INITIAL ACCESS</text><text x="668" y="923" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Test a realistic entry point under</text><text x="668" y="950" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">the agreed rules of engagement.</text><rect x="65" y="1035" width="495" height="165" rx="24" fill="#08100d" stroke="#ff4769" stroke-width="2"/><circle cx="107" cy="1077" r="24" fill="#ff4769" fill-opacity=".14" stroke="#ff4769"/><text x="107" y="1085" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="22" font-weight="800">03</text><text x="145" y="1083" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">PRIVILEGE &amp; MOVEMENT</text><text x="93" y="1123" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Validate escalation and lateral</text><text x="93" y="1150" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">movement opportunities across the</text><text x="93" y="1177" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">environment.</text><rect x="640" y="1035" width="495" height="165" rx="24" fill="#08100d" stroke="#ff4769" stroke-width="2"/><circle cx="682" cy="1077" r="24" fill="#ff4769" fill-opacity=".14" stroke="#ff4769"/><text x="682" y="1085" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="22" font-weight="800">04</text><text x="720" y="1083" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">OBJECTIVE</text><text x="668" y="1123" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Reach an agreed business or</text><text x="668" y="1150" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">technical objective without</text><text x="668" y="1177" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">unnecessary impact.</text><rect x="350" y="1235" width="495" height="165" rx="24" fill="#08100d" stroke="#ff4769" stroke-width="2"/><circle cx="392" cy="1277" r="24" fill="#ff4769" fill-opacity=".14" stroke="#ff4769"/><text x="392" y="1285" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="22" font-weight="800">05</text><text x="430" y="1283" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">REPORT &amp; IMPROVE</text><text x="378" y="1323" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Turn evidence into remediation</text><text x="378" y="1350" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">priorities, detection improvements</text><text x="378" y="1377" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">and lessons learned.</text><rect x="60" y="1370" width="1080" height="150" rx="20" fill="#07100a" stroke="#ff4769" stroke-opacity=".4"/><text x="90" y="1410" fill="#ff4769" font-family="monospace" font-size="18" font-weight="800" text-anchor="start">KEY TAKEAWAYS</text><circle cx="108" cy="1456" r="18" fill="#ff4769" fill-opacity=".15" stroke="#ff4769"/><text x="108" y="1463" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="17" font-weight="800">1</text><text x="138" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Realistic testing</text><circle cx="448" cy="1456" r="18" fill="#ff4769" fill-opacity=".15" stroke="#ff4769"/><text x="448" y="1463" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="17" font-weight="800">2</text><text x="478" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Find control gaps</text><circle cx="788" cy="1456" r="18" fill="#ff4769" fill-opacity=".15" stroke="#ff4769"/><text x="788" y="1463" text-anchor="middle" fill="#ff4769" font-family="Arial" font-size="17" font-weight="800">3</text><text x="818" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Drive improvement</text></svg>