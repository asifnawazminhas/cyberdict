<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03090d"/><stop offset=".55" stop-color="#071218"/><stop offset="1" stop-color="#020609"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#17303a" stroke-width="1" opacity=".35"/></pattern></defs>
<style>.title{font:900 82px Arial,sans-serif;fill:#f7fbff;letter-spacing:1px} .subtitle{font:700 32px Arial,sans-serif;fill:#22d3ee} .eyebrow{font:700 18px monospace;fill:#22d3ee;letter-spacing:5px} .definition{font:400 29px Arial,sans-serif;fill:#d7e4eb} .flowNum{font:700 15px monospace;fill:#22d3ee}.flowText{font:700 17px Arial,sans-serif;fill:#ecf7fb} .num{font:700 23px monospace} .cardTitle{font:800 27px Arial,sans-serif;fill:#f3f8fb} .takeLabel{font:700 20px monospace;fill:#22d3ee;letter-spacing:4px} .take{font:800 29px Arial,sans-serif;fill:#f7fbff}</style>
<rect width="1122" height="1402" fill="url(#bg)"/><rect width="1122" height="1402" fill="url(#grid)"/><circle cx="890" cy="170" r="310" fill="url(#glow)"/><rect x="18" y="18" width="1086" height="1366" rx="34" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".75"/>
<text x="58" y="78" class="eyebrow">SECURITY CONCEPT</text><text x="58" y="178" class="title">CVE</text><text x="58" y="226" class="subtitle">Common Vulnerabilities and Exposures</text>
<rect x="55" y="270" width="1012" height="62" rx="18" fill="#09151c" stroke="#22d3ee" stroke-width="2"/><foreignObject x="78" y="282" width="966" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:25px;line-height:1.3;color:#e2edf2;">A standardised identifier system for publicly disclosed security vulnerabilities.</div></foreignObject>
<g><rect x="70" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#22d3ee" stroke-width="2"/><text x="152.5" y="387" text-anchor="middle" class="flowNum">01</text><text x="152.5" y="417" text-anchor="middle" class="flowText">Vulnerability discovered</text></g><g><rect x="270" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#22d3ee" stroke-width="2"/><text x="352.5" y="387" text-anchor="middle" class="flowNum">02</text><text x="352.5" y="417" text-anchor="middle" class="flowText">CVE ID assigned</text></g><g><rect x="470" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#22d3ee" stroke-width="2"/><text x="552.5" y="387" text-anchor="middle" class="flowNum">03</text><text x="552.5" y="417" text-anchor="middle" class="flowText">Vendor advisory</text></g><g><rect x="670" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#22d3ee" stroke-width="2"/><text x="752.5" y="387" text-anchor="middle" class="flowNum">04</text><text x="752.5" y="417" text-anchor="middle" class="flowText">Enrichment &amp; scoring</text></g><g><rect x="870" y="355" width="165" height="92" rx="16" fill="#0b1720" stroke="#22d3ee" stroke-width="2"/><text x="952.5" y="387" text-anchor="middle" class="flowNum">05</text><text x="952.5" y="417" text-anchor="middle" class="flowText">Patch / mitigate</text></g><path d="M235 401 H265" stroke="#0ea5e9" stroke-width="4"/><path d="M260 394 L271 401 L260 408" fill="none" stroke="#0ea5e9" stroke-width="4"/><path d="M435 401 H465" stroke="#0ea5e9" stroke-width="4"/><path d="M460 394 L471 401 L460 408" fill="none" stroke="#0ea5e9" stroke-width="4"/><path d="M635 401 H665" stroke="#0ea5e9" stroke-width="4"/><path d="M660 394 L671 401 L660 408" fill="none" stroke="#0ea5e9" stroke-width="4"/><path d="M835 401 H865" stroke="#0ea5e9" stroke-width="4"/><path d="M860 394 L871 401 L860 408" fill="none" stroke="#0ea5e9" stroke-width="4"/><g><rect x="55" y="505" width="492" height="190" rx="22" fill="#09151c" stroke="#22d3ee" stroke-width="2"/><rect x="77" y="527" width="76" height="50" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee"/><text x="115" y="561" text-anchor="middle" class="num" fill="#22d3ee">01</text><text x="175" y="563" class="cardTitle">IDENTIFIER</text><foreignObject x="79" y="593" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">A CVE gives a publicly disclosed vulnerability a common reference name.</div></foreignObject></g><g><rect x="575" y="505" width="492" height="190" rx="22" fill="#09151c" stroke="#22d3ee" stroke-width="2"/><rect x="597" y="527" width="76" height="50" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee"/><text x="635" y="561" text-anchor="middle" class="num" fill="#22d3ee">02</text><text x="695" y="563" class="cardTitle">DISCLOSURE</text><foreignObject x="599" y="593" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">Researchers, vendors and coordinators publish technical details and affected versions.</div></foreignObject></g><g><rect x="55" y="735" width="492" height="190" rx="22" fill="#09151c" stroke="#22d3ee" stroke-width="2"/><rect x="77" y="757" width="76" height="50" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee"/><text x="115" y="791" text-anchor="middle" class="num" fill="#22d3ee">03</text><text x="175" y="793" class="cardTitle">ENRICHMENT</text><foreignObject x="79" y="823" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">Advisories, NVD records, CVSS scores and CWE mappings add context.</div></foreignObject></g><g><rect x="575" y="735" width="492" height="190" rx="22" fill="#09151c" stroke="#22d3ee" stroke-width="2"/><rect x="597" y="757" width="76" height="50" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee"/><text x="635" y="791" text-anchor="middle" class="num" fill="#22d3ee">04</text><text x="695" y="793" class="cardTitle">PRIORITISATION</text><foreignObject x="599" y="823" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">Teams combine severity, exposure and asset importance to decide what to fix first.</div></foreignObject></g><g><rect x="315" y="965" width="492" height="190" rx="22" fill="#09151c" stroke="#22d3ee" stroke-width="2"/><rect x="337" y="987" width="76" height="50" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee"/><text x="375" y="1021" text-anchor="middle" class="num" fill="#22d3ee">05</text><text x="435" y="1023" class="cardTitle">REMEDIATION</text><foreignObject x="339" y="1053" width="444" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:21px;line-height:1.35;color:#c9d6df;">Apply patches, mitigations or compensating controls and verify the issue is resolved.</div></foreignObject></g>
<g><rect x="55" y="1200" width="1012" height="132" rx="24" fill="#081219" stroke="#0ea5e9" stroke-width="2"/><circle cx="110" cy="1266" r="28" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee" stroke-width="2"/><path d="M100 1266 l9 9 18 -22" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/><text x="165" y="1248" class="takeLabel">KEY TAKEAWAY</text><foreignObject x="165" y="1260" width="850" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:27px;font-weight:700;line-height:1.25;color:#f7fbff;">A CVE is an identifier, not a complete risk assessment.</div></foreignObject></g>
</svg>