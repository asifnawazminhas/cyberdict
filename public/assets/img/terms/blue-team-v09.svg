<rect x="60" y="270" width="1080" height="150" rx="20" fill="#09120d" stroke="#49bfff" stroke-opacity=".45"/><text x="90" y="315" fill="#49bfff" font-family="monospace" font-size="16" font-weight="800" text-anchor="start">DEFINITION</text><text x="90" y="355" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">A defensive security team focused on preventing, detecting,</text><text x="90" y="389" fill="#dbe5de" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">investigating and responding to security threats.</text><g><path d="M600 500l150 55v115c0 115-70 185-150 225-80-40-150-110-150-225V555z" fill="#07131b" stroke="#49bfff" stroke-width="5"/><path d="M535 675l45 45 95-115" fill="none" stroke="#49bfff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="680" r="260" fill="none" stroke="#49bfff" stroke-opacity=".18" stroke-width="2"/></g><rect x="65" y="830" width="495" height="165" rx="24" fill="#08100d" stroke="#49bfff" stroke-width="2"/><circle cx="107" cy="872" r="24" fill="#49bfff" fill-opacity=".14" stroke="#49bfff"/><text x="107" y="880" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="22" font-weight="800">01</text><text x="145" y="878" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">MONITOR</text><text x="93" y="918" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Collect endpoint, network,</text><text x="93" y="945" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">identity and cloud telemetry for</text><text x="93" y="972" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">continuous visibility.</text><rect x="640" y="830" width="495" height="165" rx="24" fill="#08100d" stroke="#49bfff" stroke-width="2"/><circle cx="682" cy="872" r="24" fill="#49bfff" fill-opacity=".14" stroke="#49bfff"/><text x="682" y="880" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="22" font-weight="800">02</text><text x="720" y="878" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">DETECT</text><text x="668" y="918" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Identify suspicious behaviour</text><text x="668" y="945" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">using analytics, rules and threat</text><text x="668" y="972" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">intelligence.</text><rect x="65" y="1030" width="495" height="165" rx="24" fill="#08100d" stroke="#49bfff" stroke-width="2"/><circle cx="107" cy="1072" r="24" fill="#49bfff" fill-opacity=".14" stroke="#49bfff"/><text x="107" y="1080" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="22" font-weight="800">03</text><text x="145" y="1078" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">INVESTIGATE</text><text x="93" y="1118" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Correlate evidence, determine</text><text x="93" y="1145" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">scope and understand root cause</text><text x="93" y="1172" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">and impact.</text><rect x="640" y="1030" width="495" height="165" rx="24" fill="#08100d" stroke="#49bfff" stroke-width="2"/><circle cx="682" cy="1072" r="24" fill="#49bfff" fill-opacity=".14" stroke="#49bfff"/><text x="682" y="1080" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="22" font-weight="800">04</text><text x="720" y="1078" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">RESPOND</text><text x="668" y="1118" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Contain threats, remove malicious</text><text x="668" y="1145" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">activity and restore normal</text><text x="668" y="1172" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">operations.</text><rect x="350" y="1230" width="495" height="165" rx="24" fill="#08100d" stroke="#49bfff" stroke-width="2"/><circle cx="392" cy="1272" r="24" fill="#49bfff" fill-opacity=".14" stroke="#49bfff"/><text x="392" y="1280" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="22" font-weight="800">05</text><text x="430" y="1278" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">IMPROVE</text><text x="378" y="1318" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Tune detections, harden controls</text><text x="378" y="1345" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">and update playbooks from lessons</text><text x="378" y="1372" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">learned.</text><rect x="60" y="1370" width="1080" height="150" rx="20" fill="#07100a" stroke="#49bfff" stroke-opacity=".4"/><text x="90" y="1410" fill="#49bfff" font-family="monospace" font-size="18" font-weight="800" text-anchor="start">KEY TAKEAWAYS</text><circle cx="108" cy="1456" r="18" fill="#49bfff" fill-opacity=".15" stroke="#49bfff"/><text x="108" y="1463" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="17" font-weight="800">1</text><text x="138" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Visibility first</text><circle cx="448" cy="1456" r="18" fill="#49bfff" fill-opacity=".15" stroke="#49bfff"/><text x="448" y="1463" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="17" font-weight="800">2</text><text x="478" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Fast response</text><circle cx="788" cy="1456" r="18" fill="#49bfff" fill-opacity=".15" stroke="#49bfff"/><text x="788" y="1463" text-anchor="middle" fill="#49bfff" font-family="Arial" font-size="17" font-weight="800">3</text><text x="818" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Stronger resilience</text></svg>