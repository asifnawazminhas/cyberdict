<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02080b"/><stop offset="1" stop-color="#06120f"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#34d5ff" stop-opacity=".18"/><stop offset="1" stop-color="#34d5ff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#1d3b3a" stroke-opacity=".22"/></pattern>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
<style>
.title{font:800 92px Arial,Helvetica,sans-serif;fill:#f3fbff;letter-spacing:1px} .sub{font:700 34px Arial,Helvetica,sans-serif;fill:#34d5ff}
.kicker{font:700 17px monospace;fill:#34d5ff;letter-spacing:4px} .def{font:500 28px Arial,Helvetica,sans-serif;fill:#c8d7dd;line-height:1.3}
.blockTitle{font:700 25px Arial,Helvetica,sans-serif;fill:#f3fbff} .num{font:700 22px monospace} .body{font:20px Arial,Helvetica,sans-serif;color:#b8c9cf;line-height:1.35}
.flowText{font:700 20px Arial,Helvetica,sans-serif;fill:#eaf8fb} .flowNum{font:700 23px monospace;fill:#34d5ff}
.take{font:700 28px Arial,Helvetica,sans-serif;fill:#f5fbff} .takeBody{font:21px Arial,Helvetica,sans-serif;color:#c8d7dd;line-height:1.4}
</style></defs>
<rect width="1122" height="1402" fill="url(#bg)"/><rect width="1122" height="1402" fill="url(#grid)"/>
<circle cx="880" cy="220" r="260" fill="url(#glow)"/><rect x="18" y="18" width="1086" height="1366" rx="30" fill="none" stroke="#34d5ff" stroke-opacity=".55"/>
<text x="56" y="70" class="kicker">SECURITY CONCEPT</text><text x="56" y="170" class="title">JWT</text><text x="60" y="220" class="sub">JSON Web Token</text>
<rect x="56" y="268" width="1010" height="88" rx="18" fill="#071217" stroke="#34d5ff" stroke-opacity=".5"/>
<foreignObject x="82" y="288" width="958" height="52"><div xmlns="http://www.w3.org/1999/xhtml" class="def">A compact token format for carrying signed or encrypted claims between parties.</div></foreignObject>
<g transform="translate(120,390)"><rect width="250" height="120" rx="18" fill="#0a1820" stroke="#8b5cf6"/><circle cx="52" cy="60" r="26" fill="#34d5ff" fill-opacity=".18" stroke="#34d5ff"/><text x="52" y="68" text-anchor="middle" class="flowNum">1</text><text x="135" y="66" text-anchor="middle" class="flowText">HEADER</text></g><path d="M 370 450 H 411" stroke="#34d5ff" stroke-width="5"/><path d="M 400 438 L 414 450 L 400 462" fill="none" stroke="#34d5ff" stroke-width="5"/><g transform="translate(411,390)"><rect width="250" height="120" rx="18" fill="#0a1820" stroke="#8b5cf6"/><circle cx="52" cy="60" r="26" fill="#34d5ff" fill-opacity=".18" stroke="#34d5ff"/><text x="52" y="68" text-anchor="middle" class="flowNum">2</text><text x="135" y="66" text-anchor="middle" class="flowText">PAYLOAD</text></g><path d="M 661 450 H 702" stroke="#34d5ff" stroke-width="5"/><path d="M 691 438 L 705 450 L 691 462" fill="none" stroke="#34d5ff" stroke-width="5"/><g transform="translate(702,390)"><rect width="250" height="120" rx="18" fill="#0a1820" stroke="#8b5cf6"/><circle cx="52" cy="60" r="26" fill="#34d5ff" fill-opacity=".18" stroke="#34d5ff"/><text x="52" y="68" text-anchor="middle" class="flowNum">3</text><text x="135" y="66" text-anchor="middle" class="flowText">SIGNATURE</text></g>
<g transform="translate(56,600)">
<rect width="496" height="180" rx="20" fill="#08131a" stroke="#34d5ff" stroke-opacity=".65"/>
<rect x="18" y="18" width="62" height="42" rx="10" fill="#34d5ff" fill-opacity=".14" stroke="#34d5ff"/>
<text x="49" y="47" text-anchor="middle" class="num" fill="#34d5ff">01</text>
<text x="96" y="48" class="blockTitle">STRUCTURE</text>
<foreignObject x="24" y="76" width="448" height="88"><div xmlns="http://www.w3.org/1999/xhtml" class="body">Header, payload and signature form the token.</div></foreignObject>
</g><g transform="translate(570,600)">
<rect width="496" height="180" rx="20" fill="#08131a" stroke="#34d5ff" stroke-opacity=".65"/>
<rect x="18" y="18" width="62" height="42" rx="10" fill="#34d5ff" fill-opacity=".14" stroke="#34d5ff"/>
<text x="49" y="47" text-anchor="middle" class="num" fill="#34d5ff">02</text>
<text x="96" y="48" class="blockTitle">CLAIMS</text>
<foreignObject x="24" y="76" width="448" height="88"><div xmlns="http://www.w3.org/1999/xhtml" class="body">Claims describe identity, audience, issuer and expiry.</div></foreignObject>
</g><g transform="translate(56,820)">
<rect width="496" height="180" rx="20" fill="#08131a" stroke="#34d5ff" stroke-opacity=".65"/>
<rect x="18" y="18" width="62" height="42" rx="10" fill="#34d5ff" fill-opacity=".14" stroke="#34d5ff"/>
<text x="49" y="47" text-anchor="middle" class="num" fill="#34d5ff">03</text>
<text x="96" y="48" class="blockTitle">SIGNATURE</text>
<foreignObject x="24" y="76" width="448" height="88"><div xmlns="http://www.w3.org/1999/xhtml" class="body">A valid signature helps detect token tampering.</div></foreignObject>
</g><g transform="translate(570,820)">
<rect width="496" height="180" rx="20" fill="#08131a" stroke="#34d5ff" stroke-opacity=".65"/>
<rect x="18" y="18" width="62" height="42" rx="10" fill="#34d5ff" fill-opacity=".14" stroke="#34d5ff"/>
<text x="49" y="47" text-anchor="middle" class="num" fill="#34d5ff">04</text>
<text x="96" y="48" class="blockTitle">VALIDATION</text>
<foreignObject x="24" y="76" width="448" height="88"><div xmlns="http://www.w3.org/1999/xhtml" class="body">Verify algorithm, issuer, audience and lifetime.</div></foreignObject>
</g><g transform="translate(313,1040)">
<rect width="496" height="180" rx="20" fill="#08131a" stroke="#34d5ff" stroke-opacity=".65"/>
<rect x="18" y="18" width="62" height="42" rx="10" fill="#34d5ff" fill-opacity=".14" stroke="#34d5ff"/>
<text x="49" y="47" text-anchor="middle" class="num" fill="#34d5ff">05</text>
<text x="96" y="48" class="blockTitle">LIFECYCLE</text>
<foreignObject x="24" y="76" width="448" height="88"><div xmlns="http://www.w3.org/1999/xhtml" class="body">Keep tokens short lived and protect signing keys.</div></foreignObject>
</g>
<g transform="translate(56,1255)"><rect width="1010" height="95" rx="18" fill="#071217" stroke="#8b5cf6" stroke-opacity=".75"/><text x="28" y="38" class="take">KEY TAKEAWAY</text><foreignObject x="280" y="20" width="700" height="62"><div xmlns="http://www.w3.org/1999/xhtml" class="takeBody">JWT security depends on strict validation, strong key management and safe token handling.</div></foreignObject></g>
</svg>