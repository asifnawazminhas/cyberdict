<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402">
    <defs>
      <radialGradient id="g" cx="65%" cy="18%" r="70%"><stop offset="0" stop-color="#facc15" stop-opacity=".16"/><stop offset=".55" stop-color="#06100c" stop-opacity=".25"/><stop offset="1" stop-color="#020706"/></radialGradient>
      <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#18332a" stroke-opacity=".28" stroke-width="1"/></pattern>
    </defs>
    <rect width="1122" height="1402" fill="#020706"/>
    <rect width="1122" height="1402" fill="url(#g)"/>
    <rect width="1122" height="1402" fill="url(#grid)"/>
    <rect x="24" y="24" width="1074" height="1354" rx="28" fill="none" stroke="#facc15" stroke-opacity=".75" stroke-width="2"/>
    <text x="70" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="6" font-weight="700" fill="#facc15">SECURITY CONCEPT</text>
    <text x="70" y="190" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" fill="#f7fbf9">AD CS</text>
    <text x="70" y="245" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#facc15">Active Directory Certificate Services</text>
    <rect x="70" y="295" width="982" height="135" rx="22" fill="#091317" stroke="#facc15" stroke-opacity=".7" stroke-width="2"/>
    <text x="105" y="343" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="3" font-weight="700" fill="#facc15">DEFINITION</text>
    <text x="105" y="382" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#f4f8f6">
      <tspan x="105" dy="0">Enterprise certificates can strengthen identity, but unsafe</tspan><tspan x="105" dy="34">enrollment paths create risk.</tspan>
    </text>
    
        <rect x="70" y="485" width="982" height="125" rx="20" fill="#0b1518" stroke="#facc15" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="547" r="31" fill="#facc15" fill-opacity=".15" stroke="#facc15" stroke-width="2"/>
        <text x="120" y="557" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#facc15">01</text>
        <text x="185" y="528" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">TEMPLATES</text>
        <text x="185" y="563" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Templates define certificate purpose and</tspan><tspan x="185" dy="28">requirements.</tspan></text>
        
        <rect x="70" y="635" width="982" height="125" rx="20" fill="#0b1518" stroke="#facc15" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="697" r="31" fill="#facc15" fill-opacity=".15" stroke="#facc15" stroke-width="2"/>
        <text x="120" y="707" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#facc15">02</text>
        <text x="185" y="678" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">ENROLLMENT</text>
        <text x="185" y="713" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Permissions determine who may enroll.</tspan></text>
        
        <rect x="70" y="785" width="982" height="125" rx="20" fill="#0b1518" stroke="#facc15" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="847" r="31" fill="#facc15" fill-opacity=".15" stroke="#facc15" stroke-width="2"/>
        <text x="120" y="857" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#facc15">03</text>
        <text x="185" y="828" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">ISSUANCE</text>
        <text x="185" y="863" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">The CA issues certificates under configured</tspan><tspan x="185" dy="28">policy.</tspan></text>
        
        <rect x="70" y="935" width="982" height="125" rx="20" fill="#0b1518" stroke="#facc15" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="997" r="31" fill="#facc15" fill-opacity=".15" stroke="#facc15" stroke-width="2"/>
        <text x="120" y="1007" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#facc15">04</text>
        <text x="185" y="978" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">AUTHENTICATION</text>
        <text x="185" y="1013" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Certificates may be used for identity</tspan><tspan x="185" dy="28">authentication.</tspan></text>
        
        <rect x="70" y="1085" width="982" height="125" rx="20" fill="#0b1518" stroke="#facc15" stroke-opacity=".65" stroke-width="2"/>
        <circle cx="120" cy="1147" r="31" fill="#facc15" fill-opacity=".15" stroke="#facc15" stroke-width="2"/>
        <text x="120" y="1157" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#facc15">05</text>
        <text x="185" y="1128" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f4f8f6">HARDENING</text>
        <text x="185" y="1163" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#b8c8c0"><tspan x="185" dy="0">Restrict templates, protect CAs and monitor</tspan><tspan x="185" dy="28">issuance.</tspan></text>
        
    <rect x="70" y="1240" width="982" height="100" rx="20" fill="#0b1518" stroke="#facc15" stroke-width="2"/>
    <text x="105" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="3" fill="#facc15">KEY TAKEAWAY</text>
    <text x="105" y="1318" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#f4f8f6">Certificate enrollment is an identity control and must be governed like one.</text>
    </svg>