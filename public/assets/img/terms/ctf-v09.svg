-opacity=".14" stroke="#00ff66"/><text x="112" y="980" text-anchor="middle" fill="#00ff66" font-family="Arial" font-size="22" font-weight="800">03</text><text x="150" y="978" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">SOLVE</text><text x="98" y="1018" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Apply the right security skill:</text><text x="98" y="1045" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">exploit, decode, reverse, analyse</text><text x="98" y="1072" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">or investigate.</text><rect x="640" y="930" width="490" height="170" rx="24" fill="#08100d" stroke="#00ff66" stroke-width="2"/><circle cx="682" cy="972" r="24" fill="#00ff66" fill-opacity=".14" stroke="#00ff66"/><text x="682" y="980" text-anchor="middle" fill="#00ff66" font-family="Arial" font-size="22" font-weight="800">04</text><text x="720" y="978" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">CAPTURE</text><text x="668" y="1018" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Recover the hidden flag string and</text><text x="668" y="1045" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">submit it as proof of completion.</text><rect x="355" y="1140" width="490" height="170" rx="24" fill="#08100d" stroke="#00ff66" stroke-width="2"/><circle cx="397" cy="1182" r="24" fill="#00ff66" fill-opacity=".14" stroke="#00ff66"/><text x="397" y="1190" text-anchor="middle" fill="#00ff66" font-family="Arial" font-size="22" font-weight="800">05</text><text x="435" y="1188" fill="#f4f7f5" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">LEARN</text><text x="383" y="1228" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">Review the solution and turn the</text><text x="383" y="1255" fill="#a9b8ae" font-family="Arial" font-size="18" font-weight="500" text-anchor="start">challenge into reusable knowledge.</text><rect x="60" y="1370" width="1080" height="150" rx="20" fill="#07100a" stroke="#00ff66" stroke-opacity=".4"/><text x="90" y="1410" fill="#00ff66" font-family="monospace" font-size="18" font-weight="800" text-anchor="start">KEY TAKEAWAYS</text><circle cx="108" cy="1456" r="18" fill="#00ff66" fill-opacity=".15" stroke="#00ff66"/><text x="108" y="1463" text-anchor="middle" fill="#00ff66" font-family="Arial" font-size="17" font-weight="800">1</text><text x="138" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Hands-on practice</text><circle cx="448" cy="1456" r="18" fill="#00ff66" fill-opacity=".15" stroke="#00ff66"/><text x="448" y="1463" text-anchor="middle" fill="#00ff66" font-family="Arial" font-size="17" font-weight="800">2</text><text x="478" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Safe learning</text><circle cx="788" cy="1456" r="18" fill="#00ff66" fill-opacity=".15" stroke="#00ff66"/><text x="788" y="1463" text-anchor="middle" fill="#00ff66" font-family="Arial" font-size="17" font-weight="800">3</text><text x="818" y="1462" fill="#e9f1eb" font-family="Arial" font-size="18" font-weight="700" text-anchor="start">Real skills</text></svg>